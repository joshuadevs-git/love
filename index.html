<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flores y corazones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./extras.css">
</head>
<body class="container">
  <div class="night"></div>

  <!-- Intro: one tap starts the music (browsers block sound without a tap) -->
  <div class="intro" id="intro">
    <button class="intro__btn" id="start" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C1 8.3 3 5 6.3 5c2 0 3.7 1.1 4.7 2.8h2C14 6.1 15.7 5 17.7 5 21 5 23 8.3 21.6 11.6 19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
    </button>
    <p class="intro__text">Tap to begin</p>
  </div>

  <!-- Buttons -->
  <nav class="dock" aria-label="Controls">
    <button class="btn btn--pill" id="open-msg" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C1 8.3 3 5 6.3 5c2 0 3.7 1.1 4.7 2.8h2C14 6.1 15.7 5 17.7 5 21 5 23 8.3 21.6 11.6 19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
      <span>Message</span>
    </button>
    <button class="btn btn--pill" id="open-photos" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="color:var(--accent)"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Photos</span>
    </button>
    <button class="btn btn--round" id="music-btn" type="button" aria-label="Play music" aria-pressed="false">
      <svg class="i-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </nav>
  <audio id="audio" loop preload="none"></audio>
  <input type="file" id="music-file" accept="audio/*" hidden>

  <!-- Message modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="name">
      <button class="card__close" id="close-msg" type="button" aria-label="Close">&times;</button>
      <p class="card__eyebrow" id="eyebrow"></p>
      <h1 class="card__name" id="name"></h1>
      <p class="card__message" id="message"></p>
    </div>
  </div>

  <!-- Photo slideshow modal -->
  <div class="modal" id="photo-modal" aria-hidden="true">
    <div class="card card--slides" role="dialog" aria-modal="true" aria-label="Photo slideshow">
      <button class="card__close" id="close-photos" type="button" aria-label="Close">&times;</button>
      <div class="slides" id="slides">
        <div class="slides__stage" id="stage"></div>
        <button class="slides__nav slides__nav--prev" id="prev" type="button" aria-label="Previous photo">&#8249;</button>
        <button class="slides__nav slides__nav--next" id="next" type="button" aria-label="Next photo">&#8250;</button>
      </div>
      <p class="slides__caption" id="caption"></p>
      <div class="slides__dots" id="dots"></div>
    </div>
  </div>

  <div class="flowers" id="flowers"></div>
  <div class="bubbles" id="bubbles"></div>

  <script src="./script.js"></script>
</body>
</html>
